<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeInsight AI — Análise estática de repositórios</title>
    <meta
      name="description"
      content="Analise repositórios do GitHub em segundos: segurança, qualidade, dependências, arquitetura, testes, configuração, documentação e git."
    />
    <!--
      Aplica o tema antes da primeira pintura.

      Se isto esperasse o React montar, quem usa o tema escuro veria um lampejo
      branco em toda navegação. É inline e síncrono de propósito: um arquivo
      externo seria baixado tarde demais para servir ao propósito.

      A chave é a mesma de `src/lib/theme.ts` — mudá-la aqui sem mudar lá traz o
      lampejo de volta.
    -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem("codeinsight-theme");
          var automatico = !guardado || guardado === "system";
          var escuro =
            guardado === "dark" ||
            (automatico && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) {
            document.documentElement.classList.add("dark");
          }
          document.documentElement.style.colorScheme = escuro ? "dark" : "light";
        } catch (e) {
          /* localStorage bloqueado: fica no tema claro, que é o padrão do CSS. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
