name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-lint-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codeinsight
          POSTGRES_PASSWORD: codeinsight
          POSTGRES_DB: codeinsight_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codeinsight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://codeinsight:codeinsight@localhost:5432/codeinsight_ci
      JWT_SECRET: ci-lint-secret
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # Nenhuma variável de IA aqui, de propósito: o CI só passa se a aplicação
      # funcionar sem provedor externo configurado.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy app
        continue-on-error: true # tipagem de bibliotecas de terceiros ainda não é 100% coberta

      - name: Validate migrations (alembic upgrade head)
        run: alembic upgrade head

  frontend-lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check & build
        run: npm run build

  docker-build-validate:
    needs: [backend-lint-and-validate, frontend-lint-and-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (prod stage)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: prod
          push: false
          tags: codeinsight-ai-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
